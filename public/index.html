<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Chess Opening Coach</title>

  <style>
    :root {
      color-scheme: dark;
    }

    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
      background: #101619;
      color: #f9fafb;
    }

    header {
      padding: 48px 0 24px;
    }

    main {
      padding: 32px;
      border: 1px solid #3d4a45;
      border-radius: 16px;
      background: #1a2422;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #d6b66a;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(2rem, 7vw, 3.5rem);
    }

    .intro {
      max-width: 42rem;
      color: #cbd5d1;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .placeholder {
      margin: 28px 0 0;
      padding: 20px;
      border-left: 3px solid #d6b66a;
      background: #15201e;
    }
  </style>
</head>

<body>
  <header>
    <p class="eyebrow">Learn one move at a time</p>
    <h1>Chess Opening Coach</h1>
  </header>

  <main>
    <p class="intro">
      Build confidence in the opening with guided games and practical
      strategic ideas.
    </p>

    <section class="placeholder" aria-labelledby="game-heading">
      <h2 id="game-heading">Your next game is being prepared</h2>
      <p>
        The board, opening guidance, and computer opponents will appear here
        as the coach develops.
      </p>
    </section>
  </main>
</body>
</html>
